name: Test and publish image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum
      - name: Race tests and vet
        run: |
          go test -race ./...
          go vet ./...
          make build
          bin/etcd-trend help
      - name: Install published Go module outside the checkout
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/go-install-check/work" "$RUNNER_TEMP/go-install-check/bin"
          cd "$RUNNER_TEMP/go-install-check/work"
          GOWORK=off GOBIN="$RUNNER_TEMP/go-install-check/bin" go install "github.com/yckao/etcd-trend@$REVISION"
          "$RUNNER_TEMP/go-install-check/bin/etcd-trend" help
          "$RUNNER_TEMP/go-install-check/bin/etcd-trend" replay --help
          "$RUNNER_TEMP/go-install-check/bin/etcd-trend" loadtest \
            --out "$RUNNER_TEMP/go-install-check/run" --duration 250ms \
            --bytes-per-second 131072 --value-bytes 4096 --keys 3
      - name: Web interaction tests
        run: |
          npm install --prefix "$RUNNER_TEMP/etcd-trend-ui-tests" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/etcd-trend-ui-tests/node_modules" node scripts/test-web-ui.cjs

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: etcd-trend:smoke-amd64
          cache-from: type=gha,scope=etcd-trend
          build-args: REVISION=${{ github.sha }}
      - name: Exercise amd64 image
        run: scripts/test-container.sh etcd-trend:smoke-amd64 linux/amd64
      - name: Build arm64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: etcd-trend:smoke-arm64
          cache-from: type=gha,scope=etcd-trend
          build-args: REVISION=${{ github.sha }}
      - name: Exercise arm64 image under QEMU
        run: scripts/test-container.sh etcd-trend:smoke-arm64 linux/arm64
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-platform image
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=etcd-trend
          cache-to: type=gha,mode=max,scope=etcd-trend
          provenance: mode=max
          sbom: true
      - name: Record published digest
        if: steps.publish.outcome == 'success'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published `%s@%s` for linux/amd64 and linux/arm64.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
